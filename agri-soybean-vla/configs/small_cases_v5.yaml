# Experimental endpoint objective; this is not the stock Beta-time recipe.
# Native forward/update/optimizer; override model.sample_time to t=1.
# One-step inference matches that endpoint. Same pixels, schema and stats.
version: agri_small_cases_v5
seed: 42
screen_seeds: [0, 42]
certificate_seeds: [0, 1, 2, 3, 42]
warmup_steps: 20
max_steps: 1000
evaluate_at: [100, 300, 600, 1000]
profiles:
  r8_b4_n1_t1_lr3e4: {rank: 8, alpha: 8, lr: 0.0003, full_projections: false, batch_size: 4, num_steps: 1, time_sampling: endpoint_t1}
  r8_b4_n1_t1_lr1e4: {rank: 8, alpha: 8, lr: 0.0001, full_projections: false, batch_size: 4, num_steps: 1, time_sampling: endpoint_t1}
gates:
  micro8: {exact: 1.0, zone: 1.0, stop: 1.0}
  cases32: {exact: 1.0, zone: 1.0, stop: 1.0}
  cases60: {exact: 1.0, zone: 1.0, stop: 1.0}
