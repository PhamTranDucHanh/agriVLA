config_version: 1
registry_version: bilingual_templates_v0
policy_version: wilt_proxy_policy_v0
seed: 42
languages:
- vi
- en
families:
  AUTO:
    train:
    - id: auto_train_01
      vi: Xem cả 3 vườn, vườn nào đạt ngưỡng héo thì tưới nhé.
      en: Check all 3 gardens and water those that meet the wilt threshold.
    - id: auto_train_02
      vi: Tưới theo ngưỡng héo cho cả ba vườn nhé, vườn chưa đủ ngưỡng thì thôi.
      en: Use the wilt threshold for all three gardens; leave the others off.
    - id: auto_train_03
      vi: Vùng nào đạt ngưỡng héo thì tưới theo mức tương ứng; vùng còn lại giữ tắt.
      en: Water each threshold-eligible wilted zone at its prescribed level; leave
        the others off.
    - id: auto_train_04
      vi: Tưới theo mức héo quy định cho mọi vùng đạt ngưỡng.
      en: Use the prescribed wilt-based watering level for every zone meeting the
        threshold.
    - id: auto_train_05
      vi: Cho các vùng đủ ngưỡng héo nhận mức tưới quy định.
      en: Give each zone reaching the wilt threshold its prescribed watering level.
    - id: auto_train_06
      vi: Thực hiện tưới theo quy định ở những vùng đã đạt ngưỡng héo.
      en: Carry out the prescribed watering in zones whose wilt meets the threshold.
    unseen-val:
    - id: auto_val_01
      vi: Coi cả ba vườn giúp mình, đủ ngưỡng héo thì tưới theo mức tương ứng.
      en: Please check all three gardens and water eligible ones at their usual wilt-based
        levels.
    - id: auto_val_02
      vi: Áp dụng mức tưới tương ứng cho từng vùng đủ ngưỡng héo.
      en: For each zone eligible by its wilt threshold, apply the corresponding prescribed
        watering level.
    unseen-test:
    - id: auto_test_01
      vi: Kiểm tra ba vườn nhé, đạt ngưỡng héo mới tưới đúng mức.
      en: Have a look at the three gardens; water only threshold-eligible ones at
        the prescribed level.
    - id: auto_test_02
      vi: Phân bổ mức tưới quy định cho các vùng đạt ngưỡng héo; không cấp nước cho
        vùng còn lại.
      en: Assign prescribed watering levels to zones meeting the wilt threshold, with
        no water for the remaining zones.
  WORST_ONLY:
    train:
    - id: worst_train_01
      vi: Chỉ tưới vườn héo nhất đủ ngưỡng nhé, hòa thì tưới tất cả vườn cùng hạng.
      en: Only water the most wilted eligible garden; if tied, water all tied gardens.
    - id: worst_train_02
      vi: Vườn nào héo nhất và đạt ngưỡng thì tưới; bằng nhau thì tưới tất cả nhé.
      en: Water the most wilted threshold-eligible gardens, including every tie.
    - id: worst_train_03
      vi: Tưới các vùng héo nhất đã đạt ngưỡng; hòa điểm thì tưới toàn bộ vùng đồng
        hạng.
      en: Water the eligible zones at the highest wilt score, including every tied
        zone.
    - id: worst_train_04
      vi: Chọn vùng héo nhất đủ ngưỡng để tưới; nếu đồng hạng thì tưới tất cả.
      en: Select the most wilted threshold-eligible zones for watering; if tied, water
        all of them.
    - id: worst_train_05
      vi: Chỉ cấp nước cho mức héo lớn nhất đã đạt ngưỡng, gồm tất cả vùng hòa điểm.
      en: Apply water only to zones reaching the highest eligible wilt level, covering
        all ties.
    - id: worst_train_06
      vi: Giữ tưới ở các vùng héo nhất qua ngưỡng; tưới tất cả vùng nếu cùng đứng
        đầu.
      en: Limit watering to the most wilted eligible zones; water every zone tied
        for first.
    unseen-val:
    - id: worst_val_01
      vi: Chọn vườn héo nhất đủ ngưỡng để tưới giúp mình; hòa thì tưới tất cả.
      en: Please water only the worst eligible gardens, and include all ties.
    - id: worst_val_02
      vi: Chỉ tưới nhóm héo nặng nhất đủ ngưỡng; không bỏ sót bất kỳ vùng nào trong
        tất cả vùng đồng hạng.
      en: Water only the most wilted eligible group, including every zone with a tied
        maximum.
    unseen-test:
    - id: worst_test_01
      vi: Tưới toàn bộ vườn đồng hạng héo nhất nếu đủ ngưỡng nhé.
      en: Water every garden tied for worst wilt, provided the threshold is met.
    - id: worst_test_02
      vi: Ngoài các vùng héo nhất đạt ngưỡng thì giữ tắt; nếu đồng hạng, tưới toàn
        bộ nhóm đó.
      en: Keep all zones off except the most wilted eligible ones; water every member
        of a tie.
  ZONE_ONLY:
    train:
    - id: zone_train_01
      vi: Chỉ tưới vườn {zone} nếu đủ ngưỡng héo nhé.
      en: Only water garden {zone} if it meets the wilt threshold.
    - id: zone_train_02
      vi: Xem vườn {zone} thôi, đạt ngưỡng héo thì tưới nhé.
      en: Just check garden {zone}; water it if threshold-eligible.
    - id: zone_train_03
      vi: Giới hạn tưới chỉ ở vùng {zone}, theo mức quy định và điều kiện đạt ngưỡng
        héo.
      en: Limit watering to zone {zone} only, using its prescribed level once the
        wilt threshold is met.
    - id: zone_train_04
      vi: 'Chỉ xét vùng {zone}: đạt ngưỡng héo thì tưới theo mức tương ứng.'
      en: 'Consider only zone {zone}: if its wilt reaches the threshold, use the corresponding
        prescribed watering level.'
    - id: zone_train_05
      vi: Chỉ cho vùng {zone} nhận mức tưới quy định khi biểu hiện héo đủ ngưỡng.
      en: Give only zone {zone} its prescribed watering level when its wilt is threshold-eligible.
    - id: zone_train_06
      vi: Các vùng khác giữ tắt; chỉ tưới vùng {zone} nếu đã đạt ngưỡng héo.
      en: Keep the other zones off; water only zone {zone} if it has reached the wilt
        threshold.
    unseen-val:
    - id: zone_val_01
      vi: Giúp mình tưới mỗi vườn {zone} khi đủ ngưỡng héo.
      en: Please water garden {zone} only, once its wilt reaches the threshold.
    - id: zone_val_02
      vi: Dành tưới chỉ cho vùng {zone} đã đạt ngưỡng héo, không mở tưới vùng khác.
      en: Reserve watering for zone {zone} only when it meets the wilt threshold,
        with no watering elsewhere.
    unseen-test:
    - id: zone_test_01
      vi: Vườn khác để tắt, vườn {zone} đủ ngưỡng héo thì tưới nha.
      en: Leave the others off; water garden {zone} only if it is wilt-threshold eligible.
    - id: zone_test_02
      vi: Chỉ áp dụng mức tưới tương ứng ở vùng {zone} nếu đủ ngưỡng héo.
      en: Apply the corresponding prescribed watering level only in zone {zone}, provided
        its wilt meets the threshold.
  CAP_LEVEL:
    train:
    - id: cap_train_01
      vi: Tưới vườn đủ ngưỡng héo thôi, tối đa mức {cap} nhé.
      en: Water eligible gardens, but keep it at level {cap} or below.
    - id: cap_train_02
      vi: Đủ ngưỡng héo thì tưới, đừng quá mức {cap} nha.
      en: If the wilt threshold is met, water at no more than level {cap}.
    - id: cap_train_03
      vi: Áp dụng mức tưới quy định với trần {cap} ở các vùng đủ ngưỡng héo.
      en: Apply prescribed watering with a level {cap} ceiling in threshold-eligible
        wilted zones.
    - id: cap_train_04
      vi: Vùng đạt ngưỡng héo thì tưới theo quy định, tối đa mức {cap}.
      en: Water each zone reaching the wilt threshold at its prescribed level, capped
        at {cap}.
    - id: cap_train_05
      vi: Không tưới quá mức {cap}; chỉ cấp nước ở các vùng đủ ngưỡng héo.
      en: Do not water above level {cap}; apply water only where the wilt threshold
        is met.
    - id: cap_train_06
      vi: Đặt trần tưới mức {cap} cho mọi vùng đã đạt ngưỡng héo.
      en: Set a level {cap} watering cap for every zone whose wilt meets the threshold.
    unseen-val:
    - id: cap_val_01
      vi: Giới hạn mức {cap} giúp mình, chỉ tưới vườn đạt ngưỡng héo.
      en: Please cap watering at level {cap}, for threshold-eligible gardens only.
    - id: cap_val_02
      vi: Chỉ tưới những vùng đủ ngưỡng héo với mức không lớn hơn {cap}.
      en: Water only threshold-eligible wilted zones at a level no greater than {cap}.
    unseen-test:
    - id: cap_test_01
      vi: Vườn đạt ngưỡng héo thì tưới tối đa mức {cap} thôi nhé.
      en: For gardens meeting the wilt threshold, keep watering at most level {cap}.
    - id: cap_test_02
      vi: Các vùng đạt ngưỡng héo nhận mức tưới quy định hoặc thấp hơn để không vượt
        trần {cap}.
      en: Zones reaching the wilt threshold receive their prescribed watering or less
        so that the level {cap} cap is respected.
  EXCLUDE_ZONE:
    train:
    - id: exclude_train_01
      vi: Bỏ vườn {zone} nhé, vườn khác đủ ngưỡng héo thì tưới.
      en: Skip garden {zone}; water the others if they meet the wilt threshold.
    - id: exclude_train_02
      vi: Đừng tưới vườn {zone}, còn lại cứ đủ ngưỡng héo thì tưới nha.
      en: Do not water garden {zone}; water other eligible gardens as usual.
    - id: exclude_train_03
      vi: Không tưới vùng {zone}; các vùng còn lại đủ ngưỡng héo thì tưới theo quy
        định.
      en: Do not water zone {zone}; water the remaining threshold-eligible wilted
        zones as prescribed.
    - id: exclude_train_04
      vi: Loại vùng {zone} khỏi tưới và cấp mức quy định cho các vùng khác đạt ngưỡng
        héo.
      en: Exclude zone {zone} from watering and apply prescribed levels to other zones
        reaching the wilt threshold.
    - id: exclude_train_05
      vi: Ngoại trừ vùng {zone}, hãy tưới theo quy định mọi vùng đủ ngưỡng héo.
      en: Except for zone {zone}, water every zone whose wilt meets the threshold
        at its prescribed level.
    - id: exclude_train_06
      vi: Vùng {zone} không nhận nước; các vùng khác đạt ngưỡng héo được tưới theo
        mức tương ứng.
      en: Zone {zone} receives no water; other zones meeting the wilt threshold receive
        their corresponding prescribed levels.
    unseen-val:
    - id: exclude_val_01
      vi: Chừa vườn {zone} ra giúp mình, chỉ tưới vườn khác đạt ngưỡng héo.
      en: Please leave garden {zone} out and water the other threshold-eligible gardens.
    - id: exclude_val_02
      vi: Đóng tưới vùng {zone}; mọi vùng còn lại đạt ngưỡng héo thì áp dụng mức quy
        định.
      en: Shut watering off in zone {zone}; apply prescribed levels in all remaining
        zones meeting the wilt threshold.
    unseen-test:
    - id: exclude_test_01
      vi: Vườn {zone} để tắt nha, các vườn kia đạt ngưỡng héo thì tưới.
      en: Keep garden {zone} off, and water the remaining gardens only when eligible.
    - id: exclude_test_02
      vi: Chặn tưới vùng {zone} và làm theo mức héo quy định cho các vùng khác đã
        đạt ngưỡng.
      en: Block watering in zone {zone} and follow prescribed wilt-based levels for
        the other threshold-eligible zones.
  STOP_ALL:
    train:
    - id: stop_train_01
      vi: Tắt hết.
      en: Turn everything off.
    - id: stop_train_02
      vi: Ngừng tưới cả 3 vườn nhé.
      en: Stop watering all 3 gardens.
    - id: stop_train_03
      vi: Tắt tưới ở tất cả các vùng.
      en: Turn watering off in every zone.
    - id: stop_train_04
      vi: Đóng toàn bộ van tưới.
      en: Close all irrigation valves.
    - id: stop_train_05
      vi: Không tưới bất kỳ vùng nào.
      en: Do not water any zone.
    - id: stop_train_06
      vi: Cho cả ba vùng về trạng thái không tưới.
      en: Set all three zones to no watering.
    unseen-val:
    - id: stop_val_01
      vi: Dừng tưới hết giúp mình.
      en: Please stop all watering.
    - id: stop_val_02
      vi: Giữ tất cả van tưới ở trạng thái đóng.
      en: Keep every irrigation valve closed.
    unseen-test:
    - id: stop_test_01
      vi: Tắt tưới cả ba vườn đi.
      en: Switch off watering in all three gardens.
    - id: stop_test_02
      vi: Dừng toàn bộ việc tưới và đóng cả ba van.
      en: Halt all watering and close all three valves.
