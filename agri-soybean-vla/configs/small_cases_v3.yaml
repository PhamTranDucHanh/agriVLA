# Require every selected case to be correct before calling the larger panel fit.
# Frozen before any cases32/cases60 training; v1/v2 receipts remain unchanged.
version: agri_small_cases_v3
seed: 42
screen_seeds: [0, 42]
certificate_seeds: [0, 1, 2, 3, 42]
warmup_steps: 20
max_steps: 1000
evaluate_at: [100, 300, 600, 1000]
profiles:
  r8_b2_lr3e4: {rank: 8, alpha: 8, lr: 0.0003, full_projections: false, batch_size: 2}
  r16_b2_lr3e4: {rank: 16, alpha: 16, lr: 0.0003, full_projections: false, batch_size: 2}
  r8_b4_lr3e4: {rank: 8, alpha: 8, lr: 0.0003, full_projections: false, batch_size: 4}
  r16_b4_lr3e4: {rank: 16, alpha: 16, lr: 0.0003, full_projections: false, batch_size: 4}
gates:
  micro8: {exact: 1.0, zone: 1.0, stop: 1.0}
  cases32: {exact: 1.0, zone: 1.0, stop: 1.0}
  cases60: {exact: 1.0, zone: 1.0, stop: 1.0}
